## meditation-map 리버스 프록시
## :80 으로 들어온 트래픽을 app(백엔드 :80)으로 넘긴다.
## 업로드 이미지는 S3 + CloudFront 가 서빙하므로 여기서 다루지 않는다.
##
## 업스트림(app)을 변수+resolver 로 런타임에 해석한다.
## 배포 시 app 컨테이너가 재생성되며 IP 가 바뀌는데, 정적 proxy_pass 는 시작 시 IP 를
## 캐시해 배포 후 502 가 난다. Docker 내장 DNS(127.0.0.11)로 매번 다시 해석해 이를 방지.

## Cloudflare Tunnel(cloudflared) 뒤에서는 엣지가 TLS 를 끝내고 X-Forwarded-Proto: https 를 보낸다.
## 그 값을 그대로 백엔드에 넘겨야 OAuth redirect·이미지 URL 이 https 로 생성된다($scheme 으로 덮으면 http 가 됨).
## 헤더가 없으면(터널 안 거친 직접 접속) nginx 가 받은 scheme 으로 폴백.
map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    listen 443 ssl;
    server_name api.healingmedit.kr;

    # 회원/명상 이미지 업로드(백엔드 multipart 경유)가 nginx 기본 1m 제한에 걸리지 않도록 상향
    client_max_body_size 20m;
    
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    

    resolver 127.0.0.11 valid=30s ipv6=off;

    # 배포 확인용 정적 테스트 페이지 (백엔드/인증 안 거침). http://<host>/test
    location = /test {
        alias /usr/share/nginx/html/test.html;
        default_type text/html;
    }

    # (제거됨) /image/ → MinIO 프록시
    # 업로드 이미지는 S3 에 저장되고 CloudFront 의 /media/* 비헤이비어가 서빙한다.
    # 이미지 트래픽이 더 이상 이 서버를 거치지 않는다.

    # 그 외 전부 → 백엔드 앱
    location / {
        set $app_upstream app:80;
        proxy_pass http://$app_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
