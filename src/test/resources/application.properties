# 테스트는 실제 FCM 을 부르지 않는다. 개발자 .env(PUSH_PROVIDER=fcm + 서비스 계정 키)는 main() 의 DotEnvBootstrap 만
# 읽으므로 테스트 JVM 에는 들어오지 않지만, 셸에 export 해 둔 경우까지 막으려고 여기서 log 로 고정한다.
# (classpath 의 application.properties 는 같은 위치의 application.yml 보다 우선한다.)
app.notification.push.provider=log
app.notification.fcm.project-id=
app.notification.fcm.credentials-base64=
