spring:
  application:
    name: meditation-map-be

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 로컬은 update 로 편하게 쓰되, 운영은 JPA_DDL_AUTO=validate 로 덮는다.
      # 운영에서 update 는 컬럼 추가만 하고 삭제·타입 변경은 하지 않아, 코드와 실제 스키마가
      # 조용히 어긋난다. 어긋난 걸 알아채는 시점은 대개 장애가 난 뒤다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
          naver:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 네이버 명세상 authorize 에 scope 는 불필요(전송 시 일부 클라에서 오류/404 가능)
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

server:
  port: 80
  # nginx 리버스 프록시 뒤에서 X-Forwarded-* 를 신뢰 (OAuth redirect_uri·scheme/host 정확화)
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-secret-key-for-hs256-min-256-bits-please-change-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    # 동일 도메인이면 Lax. 프론트가 다른 도메인(크로스사이트)이면 None 필요(+ cookie-secure=true, HTTPS).
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  admin:
    bootstrap-login-id: ${APP_ADMIN_LOGIN_ID:admin}
    bootstrap-password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:admin}
    bootstrap-email: ${APP_ADMIN_BOOTSTRAP_EMAIL:admin@internal.local}

  storage:
    object-storage:
      # AWS S3. 자격증명은 프로퍼티로 받지 않고 기본 체인(인스턴스 역할 / 환경변수 /
      # ~/.aws/credentials)에서 찾는다.
      # .env: STORAGE_ENABLED, STORAGE_REGION, STORAGE_BUCKET, STORAGE_PUBLIC_BASE_URL
      enabled: ${STORAGE_ENABLED:false}
      region: ${STORAGE_REGION:ap-northeast-2}
      bucket: ${STORAGE_BUCKET:meditation-media}
      # 공개 URL base. 최종 URL 은 {base}/{objectKey}.
      # 버킷은 비공개이므로 CloudFront 미디어 경로를 넣는다. 예: https://app.example.com/media
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:}

  cors:
    # APP_CORS_ALLOWED_ORIGINS (.env). env 없으면 아래 로컬 3000 기본.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

  oauth2:
    # env 없어도 기동 가능하도록 : 기본값 유지 (.env 에 있으면 그걸 우선)
    frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL}
    frontend-auth-entry-url: ${OAUTH2_FRONTEND_AUTH_ENTRY_URL}

  auth:
    phone:
      # log(개발용 콘솔 출력) | naver(SENS 실제 SMS)
      sms-provider: ${PHONE_SMS_PROVIDER:log}
      otp-ttl-seconds: 300
      verify-token-ttl-seconds: 900
      resend-cooldown-seconds: 60
      # 비우면 빈 문자열로 들어오는 경우가 있어(Java PostConstruct) JWT_SECRET 으로 대체합니다.
      otp-hmac-secret: ${PHONE_OTP_HMAC_SECRET}
      naver:
        service-id: ${NAVER_SMS_ID:}
        from: ${NAVER_SMS_PHONE_NUMBER:}
        access-key: ${NAVER_ACCESS_KEY:}
        secret-key: ${NAVER_SECRET_KEY:}
        base-url: ${NAVER_SMS_BASE_URL:https://sens.apigw.ntruss.com}
        connect-timeout-ms: 5000
        read-timeout-ms: 15000

  cache:
    default-ttl-seconds: 600

logging:
  level:
    org.springframework.security: INFO
