# 로컬에서 Docker MySQL(호스트 포트 3307) 사용 시:
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# local 프로필은 인메모리 캐시(LocalCacheConfig)를 쓰므로 Redis 없이도 기동 가능합니다.
# (Redis 캐시에 남은 예전 포맷 데이터가 역직렬화 오류를 내는 것을 피하기 위함)
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/meditation?characterEncoding=utf8&serverTimezone=Asia/Seoul

app:
  storage:
    object-storage:
      # 로컬은 기본 꺼 둔다. 업로드까지 테스트하려면 .env 에 아래를 채운다.
      #   STORAGE_ENABLED=true
      #   STORAGE_BUCKET=<개발용 S3 버킷>
      #   STORAGE_PUBLIC_BASE_URL=https://<개발 CloudFront>/media
      # 자격증명은 `aws configure` 로 잡아 둔 ~/.aws/credentials 를 그대로 쓴다.
      enabled: ${STORAGE_ENABLED:false}
