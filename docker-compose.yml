# 로컬 개발·테스트용 의존 서비스만 둔다. 앱은 여기서 띄우지 않는다.
#
# nginx·cloudflared·app 은 뺐다.
#   - 운영(AWS)은 CloudFront 가 TLS 를 끝내고 EC2 의 app 컨테이너에 평문 HTTP 로 붙는다.
#     인스턴스에 nginx 가 없으므로(infra/cloudfront.tf) 로컬에만 두면 구조가 어긋난다.
#   - 터널(cloudflared)도 CloudFront 로 대체됐다.
#   - 앱 이미지는 CI 가 Dockerfile.ci 로 만들어 ECR 에 올린다. 로컬에서 앱은 gradle 로 띄운다.
#
# 쓰는 법
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=local'
#
# 호스트에 이미 MySQL·Redis 를 깔아 뒀다면 이 파일은 필요 없다. 그때는 프로필 없이 띄우고
# .env 의 DATABASE_URL 이 그 인스턴스를 가리키게 두면 된다.

services:
  # 맥/윈도우는 이미 3306 을 쓰는 MySQL 이 있는 경우가 많아 호스트 3307 로만 노출한다.
  # application-local.yml 이 이 포트를 본다.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meditation
      MYSQL_USER: meditation
      MYSQL_PASSWORD: meditation
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # local 프로필은 인메모리 캐시를 쓰므로(application-local.yml) 이 컨테이너 없이도 앱은 뜬다.
  # 운영과 같은 Redis 캐시로 확인하고 싶을 때만 쓴다.
  # 호스트에 이미 Redis 가 6379 를 잡고 있으면 이 서비스는 뜨지 않는다 — `docker compose up -d mysql` 로 DB 만 띄우면 된다.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
