services:
  # :80 진입점. 모든 요청을 app 으로 넘기는 리버스 프록시.
  # (예전의 /image/ → MinIO 분기는 제거됐다. 이미지는 S3 + CloudFront 가 서빙한다)
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/test.html:/usr/share/nginx/html/test.html:ro
      # Cloudflare Origin Certificate. 파일은 git/이미지에 없고 서버에만 존재(.gitignore).
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped

  # Cloudflare Tunnel: 엣지에서 HTTPS 종료 후 아웃바운드 터널로 nginx:80 에 전달.
  # 포트포워딩·인증서 불필요. CF 대시보드에서 public hostname → http://nginx:80 매핑.
  # CLOUDFLARE_TUNNEL_TOKEN 이 비어 있으면(로컬) 이 서비스는 띄우지 않는다(profiles).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    restart: unless-stopped
    profiles:
      - tunnel

  app:
    build: .
    # 외부 노출은 nginx 가 담당. 앱은 내부 네트워크에서 app:80 으로만 접근.
    expose:
      - "80"
    # 같은 폴더의 .env 를 컨테이너 프로세스 env 로 넘김(application.yml 의 ${NAVER_SMS_ID} 등)
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # 같은 디렉터리의 .env 에 GOOGLE_/KAKAO_ 를 넣으면 아래 치환에 사용됩니다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-docker-dev-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-docker-dev-placeholder}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-docker-dev-placeholder}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-docker-dev-placeholder}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-docker-dev-placeholder}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-docker-dev-placeholder}
      # 오브젝트 스토리지(S3). 기본은 꺼져 있고, 업로드까지 테스트할 때만 .env 에 채운다.
      # 자격증명은 ~/.aws/credentials 대신 아래 두 값을 .env 에 넣어 넘긴다(컨테이너 안에는 ~/.aws 가 없다).
      STORAGE_ENABLED: ${STORAGE_ENABLED:-false}
      STORAGE_REGION: ${STORAGE_REGION:-ap-northeast-2}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_ADMIN_LOGIN_ID: ${APP_ADMIN_LOGIN_ID}
      APP_ADMIN_BOOTSTRAP_PASSWORD: ${APP_ADMIN_BOOTSTRAP_PASSWORD}
      APP_ADMIN_BOOTSTRAP_EMAIL: ${APP_ADMIN_BOOTSTRAP_EMAIL:-admin@internal.local}
      PHONE_SMS_PROVIDER: ${PHONE_SMS_PROVIDER:-log}
      PHONE_OTP_HMAC_SECRET: ${PHONE_OTP_HMAC_SECRET:-}
      NAVER_SMS_ID: ${NAVER_SMS_ID:-}
      NAVER_SMS_PHONE_NUMBER: ${NAVER_SMS_PHONE_NUMBER:-}
      NAVER_ACCESS_KEY: ${NAVER_ACCESS_KEY:-}
      NAVER_SECRET_KEY: ${NAVER_SECRET_KEY:-}
      NAVER_SMS_BASE_URL: ${NAVER_SMS_BASE_URL:-https://sens.apigw.ntruss.com}
      # 앱에서 app.cors.allowed-origins 로 바인딩 (프론트 Origin 과 콤마로 맞춤)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meditation
      MYSQL_USER: meditation
      MYSQL_PASSWORD: meditation
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10


volumes:
  mysql-data:
