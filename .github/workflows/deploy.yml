name: Deploy backend

# main 푸시 → jar 빌드 → amd64 이미지 → ECR → SSM 으로 EC2 재배포
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "재배포할 기존 이미지 태그 (비우면 새로 빌드)"
        required: false
        type: string

concurrency:
  # 배포가 겹치면 인스턴스에서 compose 가 동시에 돌아 상태가 꼬인다.
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: meditation-map-be
  # 배포 대상 인스턴스를 찾는 Name 태그 (Terraform 의 "${project}-${environment}-app")
  INSTANCE_NAME_TAG: meditation-map-prod-app

permissions:
  contents: read
  id-token: write # OIDC 로 AWS 역할을 assume 하는 데 필요

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >>"$GITHUB_OUTPUT"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >>"$GITHUB_OUTPUT"
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.meta.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 컨테이너 안에서 Gradle 을 돌리지 않는다. jar 는 아키텍처 중립이라
      # 러너에서 만들고 이미지에는 복사만 하면 된다(빌드가 훨씬 빠르다).
      - name: Build jar
        if: steps.meta.outputs.build == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.build == 'true'

      # 배포 대상이 t3.micro(x86_64)이므로 amd64 로 빌드한다.
      # 인스턴스를 t4g 계열(arm64)로 바꾸면 이 값도 linux/arm64 로 함께 바꿔야 한다.
      - name: Build and push image
        if: steps.meta.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 인스턴스 ID 를 시크릿으로 들고 있지 않는다. user_data 나 인스턴스 타입을
      # 바꾸면 EC2 가 교체되면서 ID 가 달라지는데, 그때마다 시크릿을 손으로 갱신해야 하고
      # 놓치면 마스킹된 AccessDenied 로 나타나 원인을 찾기 어렵다. 태그로 매번 조회한다.
      - name: Resolve target instance
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME_TAG}" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          COUNT=$(printf '%s' "$ID" | wc -w | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::태그 ${INSTANCE_NAME_TAG} 로 실행 중인 인스턴스가 ${COUNT}개입니다 (1개여야 함)"
            exit 1
          fi

          echo "target instance: $ID"
          echo "INSTANCE_ID=$ID" >>"$GITHUB_ENV"

      # SSH 키 없이 배포한다. 인스턴스는 22번 포트를 아예 열지 않는다.
      - name: Deploy via SSM
        id: ssm
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ steps.meta.outputs.tag }}" \
            --parameters commands="/opt/app/deploy.sh ${{ steps.meta.outputs.tag }}" \
            --timeout-seconds 600 \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >>"$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

          # send-command 는 비동기다. 끝날 때까지 직접 기다린다.
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success) echo "deploy succeeded"; exit 0 ;;
              Failed|Cancelled|TimedOut) echo "deploy status: $STATUS"; break ;;
              *) sleep 10 ;;
            esac
          done

          echo "::error::deploy did not succeed (status=${STATUS:-unknown})"
          exit 1

      # 실패했을 때 인스턴스 로그를 보러 들어가지 않아도 되게 여기서 꺼내 준다.
      - name: Dump deploy output
        if: always() && steps.ssm.outputs.command_id != ''
        run: |
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "$INSTANCE_ID" \
            --query "{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}" \
            --output text || true
